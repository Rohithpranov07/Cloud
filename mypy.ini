[mypy]
# No python_version pin: mypy uses the running interpreter (3.11+ per TRD §4).
# Pinning it to 3.11 makes numpy's bundled stubs unparseable (they use 3.12 syntax).
warn_unused_ignores = True
warn_redundant_casts = True

# --- Documented narrow exception (CLAUDE.md quality gates, TRD NFR-4) -------------
# scikit-learn ships neither inline types nor a py.typed marker, and there is no
# official stub package for it. This override silences ONLY the missing-stub error for
# sklearn imports; every other module — including all of src/ — is still fully checked,
# and numpy/pandas/yaml are checked against real stubs (pandas-stubs, types-PyYAML).
[mypy-sklearn.*]
ignore_missing_imports = True
