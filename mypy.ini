[mypy]
# No python_version pin: mypy uses the running interpreter (3.11+ per TRD §4).
# Pinning it to 3.11 makes numpy's bundled stubs unparseable (they use 3.12 syntax).
warn_unused_ignores = True
warn_redundant_casts = True

# --- Documented narrow exceptions (CLAUDE.md quality gates, TRD NFR-4) ------------
# scikit-learn, statsmodels and scipy ship neither inline types nor a py.typed marker
# (installing scipy-stubs separately is a real option, but it is an unpinned third
# package pulling its own version constraints; T10.4 only needs scipy.stats.wilcoxon
# and scipy.stats.rankdata, so ignoring the missing stub is narrower). These overrides
# silence ONLY the missing-stub error for those third-party imports. Every other module
# — including all of src/ — is still fully checked, and numpy/pandas/yaml are checked
# against real stubs (pandas-stubs, types-PyYAML). No `# type: ignore` comments exist
# anywhere in src/.
[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-statsmodels.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True
