# Tunable constants for the Semantic Autoscaling Core Prototype.
#
# Source of truth: TRD.md §1.3 (TraceConfig) and TRD.md §1.6 (PRIMITIVE_MAP and unit tables).
# VALUES here are tunable. KEYS are NOT — every primitive name below must match
# PRIMITIVE_MAP's values exactly (TRD §1.6), and every archetype name must be one of the
# four fixed archetypes in TRD §1.1. Modules read from this file rather than hardcoding.

# ---------------------------------------------------------------------------
# Fixed archetype enum — TRD §1.1. Do not add, remove, or rename.
# ---------------------------------------------------------------------------
archetypes:
  - short_conversational
  - long_context_rag
  - agentic_tool_using
  - batch_offline

# ---------------------------------------------------------------------------
# TraceConfig defaults — TRD §1.3.
# Invariant: the aggregate requests/minute series stays approximately flat
# (std/mean < 0.3) across the shift window. The shift is visible ONLY in the
# per-archetype composition, never in the aggregate count.
# ---------------------------------------------------------------------------
trace:
  duration_minutes: 120
  base_rate_per_min: 50.0
  shift_start_min: 60
  shift_duration_min: 15
  seed: 42
  # Composition before the shift. Proportions must sum to 1.0.
  mix_before:
    short_conversational: 0.55
    long_context_rag: 0.20
    agentic_tool_using: 0.10
    batch_offline: 0.15
  # Composition after the shift: the agentic share rises 10% -> 40% while the
  # short-conversational share falls to absorb it, at constant aggregate rate
  # (PRD §4 "Trace Generator"; TRD §6 acceptance gate). Must sum to 1.0.
  mix_after:
    short_conversational: 0.25
    long_context_rag: 0.20
    agentic_tool_using: 0.40
    batch_offline: 0.15

# ---------------------------------------------------------------------------
# PRIMITIVE_MAP — TRD §1.6. Archetype -> AWS serving primitive. KEYS FIXED.
# ---------------------------------------------------------------------------
primitive_map:
  short_conversational: bedrock_on_demand
  long_context_rag: sagemaker_endpoint
  agentic_tool_using: eks_gpu_reserved
  batch_offline: eks_gpu_spot

# ---------------------------------------------------------------------------
# PRIMITIVE_UNIT_CAPACITY — TRD §1.6. Requests/minute served by one capacity unit.
# ---------------------------------------------------------------------------
primitive_unit_capacity:
  bedrock_on_demand: 30
  sagemaker_endpoint: 15
  eks_gpu_reserved: 10
  eks_gpu_spot: 12

# ---------------------------------------------------------------------------
# UNIT_COST_PER_MIN — TRD §1.6. Simulated cost of one capacity unit per minute.
# ---------------------------------------------------------------------------
unit_cost_per_min:
  bedrock_on_demand: 0.02
  sagemaker_endpoint: 0.05
  eks_gpu_reserved: 0.09
  eks_gpu_spot: 0.04

# ---------------------------------------------------------------------------
# Evaluation run parameters (T7.1). The forecast horizon and the baseline's
# per-unit capacity come from the TRD §2 signature defaults.
# ---------------------------------------------------------------------------
evaluation:
  start_minute: 10              # warm-up: the forecaster needs history before it is asked
  forecast_horizon: 5           # TRD §2 default
  baseline_per_unit_capacity: 20  # TRD §2 default for baseline_scaling_decision
  recalibrate_every_minutes: 20 # T7.1: re-fit the classifier on this cadence
  # Budget for the whole simulated window, against which END-OF-WINDOW spend is checked.
  # Chosen the way a tenant would set one, not to manufacture a result: the pre-shift
  # steady-state run rate is 0.20/min over the 110 simulated minutes = 22.20, so this is
  # that run rate plus ~8% headroom. A workload that never changes composition stays
  # comfortably inside it; the compositional shift is what pushes it over.
  budget: 24.0
